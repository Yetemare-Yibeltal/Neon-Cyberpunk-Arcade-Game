<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple login form</title>
    <link rel="stylesheet" href="s.login.css" />
    <div class="box">
      <form action="">
        <br />
        <h1>Login</h1>
        <input
          type="email"
          name="email"
          placeholder="Email"
          maxlength="25"
          required
        />
        <input
          type="password"
          name="password"
          placeholder="password"
          maxlength="10"
          required
        />
        <button type="submit">Login</button>
        <br />
        <a href="#"> Forgot password?</a>
      </form>
    </div>
  </head>
  <body></body>
</html>
